<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lewp - download images</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5 text-center">
        <h1>Welcome to lewp</h1>
        <p>Enter a URL below to download images</p>
        <div class="input-group mb-3 justify-content-center">
            <input type="text" id="urlInput" class="form-control" placeholder="Enter URL" style="max-width: 300px;">
            <div class="input-group-append">
                <button id="lewpButton" class="btn btn-primary">Download</button>
            </div>
        </div>
        <p id="status" class="mt-3"></p>
        <div id="progressContainer" style="display: none; max-width: 500px; margin: 20px auto;">
            <div class="progress">
                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
            </div>
            <p id="progressText" class="mt-2"></p>
        </div>
        <div id="errorContainer" class="alert alert-danger mt-3" style="display: none; max-width: 600px; margin: 0 auto; text-align: left;"></div>
        <div id="fileList" class="mt-3" style="display: none; max-width: 600px; margin: 0 auto; text-align: left;">
            <h5>Images found:</h5>
            <ul id="fileListItems" class="list-group"></ul>
        </div>
    </div>

    <!-- Include JSZip library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <script>
        // Helper function to extract image URLs from various sources
        function extractImageUrls(doc, baseUrl) {
            const imageUrls = new Set();
            
            // 1. Get images from <img> tags
            doc.querySelectorAll('img').forEach(img => {
                const src = img.src || img.getAttribute('data-src') || img.getAttribute('data-lazy-src');
                if (src) imageUrls.add(src);
                
                // Handle srcset attribute
                const srcset = img.srcset || img.getAttribute('data-srcset');
                if (srcset) {
                    srcset.split(',').forEach(entry => {
                        const url = entry.trim().split(' ')[0];
                        if (url) imageUrls.add(url);
                    });
                }
            });
            
            // 2. Get images from <picture> elements
            doc.querySelectorAll('picture source').forEach(source => {
                const srcset = source.srcset;
                if (srcset) {
                    srcset.split(',').forEach(entry => {
                        const url = entry.trim().split(' ')[0];
                        if (url) imageUrls.add(url);
                    });
                }
            });
            
            // 3. Get background images from inline styles
            doc.querySelectorAll('[style*="background"]').forEach(el => {
                const style = el.getAttribute('style');
                const matches = style.match(/url\(['"]?([^'")]+)['"]?\)/g);
                if (matches) {
                    matches.forEach(match => {
                        const url = match.replace(/url\(['"]?([^'")]+)['"]?\)/, '$1');
                        if (url && !url.startsWith('data:')) imageUrls.add(url);
                    });
                }
            });
            
            // 4. Get images from <link> tags with rel="preload" as="image"
            doc.querySelectorAll('link[rel="preload"][as="image"]').forEach(link => {
                const href = link.href;
                if (href) imageUrls.add(href);
            });
            
            // Convert relative URLs to absolute
            return Array.from(imageUrls).map(url => {
                try {
                    return new URL(url, baseUrl).href;
                } catch (e) {
                    return null;
                }
            }).filter(url => url !== null);
        }
        
        // Helper function to validate if URL points to an image
        function isImageUrl(url) {
            const imageExtensions = ['.jpg', '.jpeg', '.png', '.gif', '.webp', '.bmp', '.svg', '.ico'];
            const urlLower = url.toLowerCase();
            return imageExtensions.some(ext => urlLower.includes(ext));
        }
        
        // Helper function to check image dimensions
        async function checkImageDimensions(url, minSize = 100) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = function() {
                    resolve({
                        valid: this.width >= minSize && this.height >= minSize,
                        width: this.width,
                        height: this.height
                    });
                };
                img.onerror = function() {
                    resolve({ valid: false, width: 0, height: 0 });
                };
                img.src = url;
            });
        }
        
        // Helper function to show error
        function showError(message, details = '') {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.innerHTML = `<strong>Error:</strong> ${message}`;
            if (details) {
                errorContainer.innerHTML += `<br><small>${details}</small>`;
            }
            errorContainer.style.display = 'block';
        }
        
        // Helper function to update progress
        function updateProgress(current, total, message) {
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            
            progressContainer.style.display = 'block';
            const percentage = Math.round((current / total) * 100);
            progressBar.style.width = `${percentage}%`;
            progressBar.setAttribute('aria-valuenow', percentage);
            progressText.textContent = message;
        }
        
        // Helper function to add file to list
        function addFileToList(filename, dimensions, size) {
            const fileListContainer = document.getElementById('fileList');
            const fileListItems = document.getElementById('fileListItems');
            
            fileListContainer.style.display = 'block';
            
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center';
            li.innerHTML = `
                <span>${filename}</span>
                <small class="text-muted">${dimensions.width}x${dimensions.height} - ${(size / 1024).toFixed(1)}KB</small>
            `;
            fileListItems.appendChild(li);
        }
        
        document.getElementById('lewpButton').addEventListener('click', async function() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const status = document.getElementById('status');
            const progressContainer = document.getElementById('progressContainer');
            const errorContainer = document.getElementById('errorContainer');
            const fileList = document.getElementById('fileList');
            const fileListItems = document.getElementById('fileListItems');
            const lewpButton = document.getElementById('lewpButton');
            
            // Reset UI
            status.textContent = "Processing...";
            progressContainer.style.display = 'none';
            errorContainer.style.display = 'none';
            fileList.style.display = 'none';
            fileListItems.innerHTML = '';
            lewpButton.disabled = true;

            if (!urlInput) {
                status.textContent = "";
                showError("Please enter a valid URL.");
                lewpButton.disabled = false;
                return;
            }

            // Add URL validation and allowance logic
            let url = urlInput;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                if (url.startsWith('www.')) {
                    url = 'https://' + url;
                } else {
                    url = 'https://www.' + url;
                }
            }

            try {
                // Fetch the webpage
                updateProgress(0, 100, "Fetching webpage...");
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (!data.contents) {
                    throw new Error("No content received from the webpage");
                }
                
                updateProgress(20, 100, "Parsing webpage...");
                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, 'text/html');
                
                // Extract all possible image URLs
                const imageUrls = extractImageUrls(doc, url);
                
                if (imageUrls.length === 0) {
                    status.textContent = "";
                    showError("No images found on the webpage.", "Try a different URL or check if the website allows scraping.");
                    lewpButton.disabled = false;
                    return;
                }
                
                updateProgress(40, 100, `Found ${imageUrls.length} potential images, checking dimensions...`);
                
                // Filter images by dimensions (minimum 100x100)
                const validImages = [];
                const imageDimensions = new Map();
                
                for (let i = 0; i < imageUrls.length; i++) {
                    const imgUrl = imageUrls[i];
                    updateProgress(40 + (i / imageUrls.length) * 20, 100, `Checking image ${i + 1}/${imageUrls.length}...`);
                    
                    try {
                        const dimensions = await checkImageDimensions(imgUrl, 100);
                        if (dimensions.valid) {
                            validImages.push(imgUrl);
                            imageDimensions.set(imgUrl, dimensions);
                        }
                    } catch (error) {
                        console.warn(`Failed to check dimensions for ${imgUrl}:`, error);
                    }
                }
                
                if (validImages.length === 0) {
                    status.textContent = "";
                    showError("No images meeting size requirements found.", "All images were smaller than 100x100 pixels (likely tracking pixels or icons).");
                    lewpButton.disabled = false;
                    return;
                }
                
                updateProgress(60, 100, `Processing ${validImages.length} valid images...`);
                status.textContent = `Found ${validImages.length} images (filtered from ${imageUrls.length} total)`;

                const zip = new JSZip();
                let successCount = 0;
                let errorCount = 0;
                const errors = [];

                // Use Promise.all to properly handle async operations
                const downloadPromises = validImages.map(async (imgUrl, index) => {
                    try {
                        updateProgress(60 + (index / validImages.length) * 30, 100, `Downloading image ${index + 1}/${validImages.length}...`);
                        
                        const imgResponse = await fetch(imgUrl);
                        if (!imgResponse.ok) {
                            throw new Error(`HTTP error! status: ${imgResponse.status}`);
                        }
                        
                        const imgBlob = await imgResponse.blob();
                        
                        // Verify it's actually an image
                        if (!imgBlob.type.startsWith('image/')) {
                            throw new Error(`Not an image file (type: ${imgBlob.type})`);
                        }
                        
                        // Generate a safe filename
                        let imgName = imgUrl.split('/').pop().split('?')[0];
                        if (!imgName || imgName.length > 100) {
                            const extension = imgBlob.type.split('/')[1] || 'jpg';
                            imgName = `image_${index + 1}.${extension}`;
                        }
                        
                        // Ensure unique filenames
                        let finalName = imgName;
                        let counter = 1;
                        while (zip.file(finalName)) {
                            const parts = imgName.split('.');
                            const ext = parts.pop();
                            const base = parts.join('.');
                            finalName = `${base}_${counter}.${ext}`;
                            counter++;
                        }
                        
                        zip.file(finalName, imgBlob);
                        successCount++;
                        
                        // Add to file list
                        const dimensions = imageDimensions.get(imgUrl);
                        addFileToList(finalName, dimensions, imgBlob.size);
                        
                    } catch (error) {
                        errorCount++;
                        const errorMsg = `Failed to download ${imgUrl}: ${error.message}`;
                        console.error(errorMsg);
                        errors.push(errorMsg);
                    }
                });

                await Promise.all(downloadPromises);
                
                if (successCount === 0) {
                    status.textContent = "";
                    showError("Failed to download any images.", errors.slice(0, 5).join('<br>'));
                    lewpButton.disabled = false;
                    return;
                }
                
                updateProgress(90, 100, "Creating zip file...");
                
                const content = await zip.generateAsync({ type: 'blob' });
                
                updateProgress(100, 100, "Download ready!");
                
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
                link.download = `images_${timestamp}.zip`;
                link.click();
                
                status.textContent = `Download complete! ${successCount} images saved.`;
                if (errorCount > 0) {
                    status.textContent += ` (${errorCount} failed)`;
                }
                
                lewpButton.disabled = false;
                
            } catch (error) {
                console.error('Error:', error);
                status.textContent = "";
                showError("Error processing the webpage.", `${error.message}. This could be due to CORS restrictions, network issues, or the website blocking scraping attempts.`);
                lewpButton.disabled = false;
            }
        });
    </script>
</body>
</html>
